name: NEPSE Pulse Kotlin Android Build

on:
  push:
    branches: [kotlin-migration]
    paths:
      - "kotlin-web/**"
      - ".github/workflows/kotlin-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle for Kotlin/JS
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Compile Kotlin/JS production bundle
        working-directory: kotlin-web
        run: gradle jsBrowserProductionWebpack --no-daemon

      - name: Prepare Kotlin web assets and native AdMob bridge
        shell: bash
        run: |
          set -euo pipefail
          test -d "kotlin-web/build"
          mkdir -p android-web
          JS_FILE="kotlin-web/build/kotlin-webpack/js/productionExecutable/kotlin-web.js"
          if [ ! -s "$JS_FILE" ]; then
            JS_FILE="$(find kotlin-web/build -type f -name 'kotlin-web.js' | grep -v 'node_modules' | head -1)"
          fi
          if [ ! -s "$JS_FILE" ]; then
            echo "Kotlin/JS production bundle kotlin-web.js was not found."
            find kotlin-web/build -maxdepth 4 -type f -name '*.js' -print | head -20
            exit 1
          fi
          echo "Using Kotlin/JS bundle: $JS_FILE ($(wc -c < "$JS_FILE") bytes)"
          cp "$JS_FILE" android-web/kotlin-web.js
          cp kotlin-web/src/jsMain/resources/index.html android-web/index.html
          cp kotlin-web/src/jsMain/resources/styles.css android-web/styles.css
          cp kotlin-web/src/jsMain/resources/auth-config.js android-web/auth-config.js
          cp kotlin-web/src/jsMain/resources/np-admob-banner.js android-web/np-admob-banner.js
          cp privacy-policy.html android-web/privacy-policy.html
          cp delete-account.html android-web/delete-account.html
          cp nepse-pulse-exact-icon.png android-web/nepse-pulse-exact-icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-web/index.html")
          html = p.read_text()
          html = html.replace('  <script src="kotlin-web.js"></script>', '  <script src="./np-capacitor-plugins.bundle.js"></script>\n  <script src="kotlin-web.js"></script>\n  <script src="./np-admob-banner.js"></script>')
          if "np-capacitor-plugins.bundle.js" not in html or "np-admob-banner.js" not in html:
              raise SystemExit("Native plugin scripts were not injected into Kotlin app HTML")
          p.write_text(html)
          PY
          test -s android-web/kotlin-web.js
          echo "Kotlin/JS bundle packaged."

      - name: Install Capacitor and native plugins
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/browser@7 @capacitor-community/admob@7
          npm install --save-dev @capacitor/cli@7 esbuild @capacitor/assets

      - name: Bundle Capacitor plugin bridge
        run: |
          cat > capacitor-plugins-entry.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';
          import { AdMob } from '@capacitor-community/admob';

          window.Capacitor = Capacitor;
          window.NP_CAP_APP = App;
          window.NP_CAP_BROWSER = Browser;
          window.NP_CAP_ADMOB = AdMob;
          EOF
          npx esbuild capacitor-plugins-entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=android-web/np-capacitor-plugins.bundle.js

      - name: Generate Android project and sync Kotlin app
        run: |
          npx cap init "NEPSE Pulse" "com.nepsepulse.app" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Generate NEPSE Pulse launcher icon and splash screen
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          test -s nepse-pulse-exact-icon.png
          # Uses the exact repository artwork for both the launcher icon and the
          # Android 12 / pre-12 splash screen. The overlay XML is copied over the
          # generated project so a later `npx cap sync` cannot remove it.
          python3 scripts/generate_android_branding.py android/app/src/main/res
          test -s android/app/src/main/res/drawable-xxxhdpi/np_splash_logo.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "Branded launcher and splash resources generated from nepse-pulse-exact-icon.png."


      - name: Enforce NEPSE Pulse launcher icon in Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("Android application element is missing")
          ns = "{http://schemas.android.com/apk/res/android}"
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          ET.indent(tree, space="    ")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          res = Path("android/app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  if not (res / f"mipmap-{density}" / name).is_file():
                      raise SystemExit(f"Missing launcher artwork: mipmap-{density}/{name}")
          print("Manifest explicitly references the NEPSE Pulse launcher and round icons.")
          PY

      - name: Set Android SDK levels and Play Store version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          if variables.exists():
              lines = variables.read_text().splitlines()
              for i, line in enumerate(lines):
                  for key, value in (("minSdkVersion", 25), ("targetSdkVersion", 36), ("compileSdkVersion", 36)):
                      if re.match(r"^\s*" + key + r"\s*=", line):
                          lines[i] = re.sub(r"=\s*\d+", "= " + str(value), line)
              variables.write_text("\n".join(lines) + "\n")

          # compileSdk 36 needs AGP 8.9+; Capacitor's template pins an older
          # plugin that only warns about SDK 36.
          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          root_text = re.sub(
              r"com\.android\.tools\.build:gradle:[0-9.]+",
              "com.android.tools.build:gradle:8.9.2",
              root_text,
          )
          if "com.android.tools.build:gradle:8.9.2" not in root_text:
              raise SystemExit("Could not pin Android Gradle Plugin 8.9.2")
          root_gradle.write_text(root_text)

          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text().splitlines()
          version_code_set = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode "):
                  lines[i] = indent + "versionCode 10"
                  version_code_set = True
              elif stripped.startswith("versionName "):
                  lines[i] = indent + 'versionName "1"'
          if not version_code_set:
              raise SystemExit("Could not set Android versionCode")
          gradle.write_text("\n".join(lines) + "\n")
          print("Configured minSdk 25, target/compile SDK 36, versionCode 10, versionName 1.")
          PY

      - name: Configure AdMob app ID and release optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          values = Path("android/app/src/main/res/values/strings.xml")
          tree = ET.parse(values)
          root = tree.getroot()
          name = "admob_app_id"
          existing = root.find("string[@name='admob_app_id']")
          if existing is None:
              node = ET.SubElement(root, "string", {"name": name})
              node.text = "ca-app-pub-1565800134063497~9972330494"
          else:
              existing.text = "ca-app-pub-1565800134063497~9972330494"
          ET.indent(tree, space="    ")
          tree.write(values, encoding="utf-8", xml_declaration=True)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = ET.parse(manifest)
          app = xml.getroot().find("application")
          if app is None:
              raise SystemExit("Android application element missing")
          ns = "{http://schemas.android.com/apk/res/android}"
          found = [m for m in app.findall("meta-data") if m.get(ns + "name") == "com.google.android.gms.ads.APPLICATION_ID"]
          if not found:
              ET.SubElement(app, "meta-data", {
                  ns + "name": "com.google.android.gms.ads.APPLICATION_ID",
                  ns + "value": "@string/admob_app_id"
              })
          ET.indent(xml, space="    ")
          xml.write(manifest, encoding="utf-8", xml_declaration=True)

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          # Keep release resources intact while the launcher/splash pipeline is
          # verified on-device. R8/resource shrinking previously made it too
          # easy to ship an incomplete-looking package when generated resources
          # were not retained as expected.
          text = re.sub(r"(?m)^(\\s*)minifyEnabled\\s+(?:true|false)\\s*$", r"\\1minifyEnabled false", text)
          text = re.sub(r"(?m)^(\\s*)shrinkResources\\s+(?:true|false)\\s*$", r"\\1shrinkResources false", text)
          if not re.search(r"(?m)^\\s*minifyEnabled\\s+", text):
              text = text.replace("release {", "release {\\n            minifyEnabled false", 1)
          if not re.search(r"(?m)^\\s*shrinkResources\\s+", text):
              text = text.replace("release {", "release {\\n            shrinkResources false", 1)
          gradle.write_text(text)
          print("AdMob app ID and release optimization configured.")

          manifest_text = manifest.read_text()
          manifest_text = manifest_text.replace(
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          )
          manifest_text = manifest_text.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          manifest.write_text(manifest_text)
          print("Android permissions and cleartext policy configured.")
          PY


      - name: Register Android Supabase OAuth callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element is missing")
          ns = "{http://schemas.android.com/apk/res/android}"
          activity = next((node for node in app.findall("activity")
                           if "MainActivity" in node.get(ns + "name", "")), None)
          if activity is None:
              raise SystemExit("Capacitor MainActivity not found")
          activity.set(ns + "launchMode", "singleTask")
          already = any(
              data.get(ns + "scheme") == "com.nepsepulse.app" and
              data.get(ns + "host") == "login-callback"
              for intent in activity.findall("intent-filter")
              for data in intent.findall("data")
          )
          if not already:
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {ns + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {ns + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {ns + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {
                  ns + "scheme": "com.nepsepulse.app",
                  ns + "host": "login-callback"
              })
          ET.indent(tree, space="    ")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Supabase OAuth deep-link callback configured on Capacitor MainActivity.")
          PY

      - name: Verify Capacitor plugins, SDK levels, deep link and branding
        run: |
          python3 - <<'PY'
          import json, re, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          errors = []
          variables = Path("android/variables.gradle").read_text()
          for key, expected in (("minSdkVersion", 25), ("targetSdkVersion", 36), ("compileSdkVersion", 36)):
              match = re.search(r"^\s*" + key + r"\s*=\s*(\d+)", variables, re.MULTILINE)
              if not match or int(match.group(1)) != expected:
                  errors.append(f"{key} is not {expected}")

          plugins = json.loads(Path("android/app/src/main/assets/capacitor.plugins.json").read_text())
          registered = {entry.get("pkg", "") for entry in plugins}
          for required in ("@capacitor/app", "@capacitor/browser"):
              if required not in registered:
                  errors.append(f"{required} is not registered in capacitor.plugins.json")

          manifest = ET.parse("android/app/src/main/AndroidManifest.xml")
          ns = "{http://schemas.android.com/apk/res/android}"
          activity = next((a for a in manifest.getroot().iter("activity") if "MainActivity" in a.get(ns + "name", "")), None)
          if activity is None:
              errors.append("MainActivity is missing")
          else:
              if activity.get(ns + "launchMode") != "singleTask":
                  errors.append("MainActivity launchMode is not singleTask")
              data = [d for i in activity.findall("intent-filter") for d in i.findall("data")]
              if not any(d.get(ns + "scheme") == "com.nepsepulse.app" and d.get(ns + "host") == "login-callback" for d in data):
                  errors.append("OAuth deep-link intent filter is missing")

          res = Path("android/app/src/main/res")
          required_files = [
              "values/styles.xml",
              "values-v31/styles.xml",
              "drawable/np_splash.xml",
              "mipmap-anydpi-v26/ic_launcher.xml",
              "mipmap-anydpi-v26/ic_launcher_round.xml",
              "drawable-xxxhdpi/np_splash_logo.png",
              "drawable-xxxhdpi/np_splash_icon.png",
              "mipmap-xxxhdpi/ic_launcher.png",
              "mipmap-xxxhdpi/ic_launcher_foreground.png",
          ]
          for relative in required_files:
              if not (res / relative).is_file():
                  errors.append(f"missing branding resource {relative}")
          styles = (res / "values/styles.xml").read_text()
          for marker in ("windowSplashScreenAnimatedIcon", "@drawable/np_splash", "@color/np_splash_background"):
              if marker not in styles:
                  errors.append(f"launch theme is missing {marker}")
          v31 = (res / "values-v31/styles.xml").read_text()
          if "android:windowSplashScreenAnimatedIcon" not in v31:
              errors.append("Android 12 splash theme is incomplete")

          if errors:
              print("Android verification failed:")
              for error in errors:
                  print(" - " + error)
              sys.exit(1)
          print("Verified minSdk 25, target/compile SDK 36, registered @capacitor/app + @capacitor/browser,")
          print("singleTask OAuth deep link, and NEPSE Pulse launcher/splash resources.")
          PY

      - name: Build Debug APK with Google test ad units
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/public/np-admob-banner.js")
          s = p.read_text()
          ids = {
            "ca-app-pub-1565800134063497/8028868444": "ca-app-pub-3940256099942544/6300978111",
            "ca-app-pub-1565800134063497/1639379056": "ca-app-pub-3940256099942544/1033173712",
            "ca-app-pub-1565800134063497/9483086731": "ca-app-pub-3940256099942544/5575463023",
          }
          for old, new in ids.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one " + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Restore production ad units and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/public/np-admob-banner.js")
          s = p.read_text()
          ids = {
            "ca-app-pub-3940256099942544/6300978111": "ca-app-pub-1565800134063497/8028868444",
            "ca-app-pub-3940256099942544/1033173712": "ca-app-pub-1565800134063497/1639379056",
            "ca-app-pub-3940256099942544/5575463023": "ca-app-pub-1565800134063497/9483086731",
          }
          for old, new in ids.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one " + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            mkdir -p "$RUNNER_TEMP/nepse-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nepse-signing/upload-keystore.jks"
            keytool -list -keystore "$RUNNER_TEMP/nepse-signing/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nepse-signing/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", block + "\n    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in s:
              build_types = s.index("    buildTypes {")
              release_pos = s.index("release {", build_types)
              s = s[:release_pos] + s[release_pos:].replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
            echo "Release signing configured."
          else
            echo "No upload keystore secrets found: release AAB will be unsigned and cannot be uploaded to Play Console yet."
          fi
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Verify release APK and AAB contain the app bundle and launcher branding
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK" || { echo "Release APK missing or empty"; exit 1; }
          test -n "$AAB" && test -s "$AAB" || { echo "Release AAB missing or empty"; exit 1; }
          test -s android/app/src/main/assets/public/kotlin-web.js || { echo "Kotlin/JS app bundle missing from Android assets"; exit 1; }
          APK_LIST="$(unzip -Z1 "$APK")"
          echo "$APK_LIST" | grep -Eq '(^|/)kotlin-web\.js$' || { echo "Kotlin/JS production bundle missing from release APK"; exit 1; }
          echo "$APK_LIST" | grep -Eq '(^|/)ic_launcher[^/]*\.(png|webp)$' || { echo "Launcher artwork missing from release APK"; exit 1; }
          AAB_LIST="$(unzip -Z1 "$AAB")"
          echo "$AAB_LIST" | grep -Eq '(^|/)assets/.*kotlin-web\.js$' || { echo "Kotlin/JS production bundle missing from release AAB"; exit 1; }
          echo "Release APK and AAB contain the Kotlin/JS application bundle; APK launcher artwork is present."
          
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEPSE-Pulse-Kotlin-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
