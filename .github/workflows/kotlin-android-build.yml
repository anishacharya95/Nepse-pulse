name: NEPSE Pulse Kotlin Android Build

on:
  push:
    branches: [kotlin-migration]
    paths:
      - "kotlin-web/**"
      - ".github/workflows/kotlin-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle for Kotlin/JS
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Compile Kotlin/JS production bundle
        working-directory: kotlin-web
        run: gradle jsBrowserProductionWebpack --no-daemon

      - name: Prepare Kotlin web assets and native AdMob bridge
        shell: bash
        run: |
          set -euo pipefail
          test -d "kotlin-web/build"
          mkdir -p android-web
          JS_FILE="$(find kotlin-web/build -type f -name 'kotlin-web.js' -print -quit)"
          if [ -z "$JS_FILE" ]; then
            echo "Kotlin/JS production bundle kotlin-web.js was not found."
            find "$DIST" -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$JS_FILE" android-web/kotlin-web.js
          cp kotlin-web/src/jsMain/resources/index.html android-web/index.html
          cp kotlin-web/src/jsMain/resources/styles.css android-web/styles.css
          cp kotlin-web/src/jsMain/resources/auth-config.js android-web/auth-config.js
          cp kotlin-web/src/jsMain/resources/np-admob-banner.js android-web/np-admob-banner.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-web/index.html")
          html = p.read_text()
          html = html.replace('  <script src="kotlin-web.js"></script>', '  <script src="./np-capacitor-plugins.bundle.js"></script>\\n  <script src="kotlin-web.js"></script>\\n  <script src="./np-admob-banner.js"></script>')
          if "np-capacitor-plugins.bundle.js" not in html or "np-admob-banner.js" not in html:
              raise SystemExit("Native plugin scripts were not injected into Kotlin app HTML")
          p.write_text(html)
          PY
          test -s android-web/kotlin-web.js
          echo "Kotlin/JS bundle packaged."

      - name: Install Capacitor and native plugins
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/browser@7 @capacitor-community/admob@7
          npm install --save-dev @capacitor/cli@7 esbuild

      - name: Bundle Capacitor plugin bridge
        run: |
          cat > capacitor-plugins-entry.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';
          import { AdMob } from '@capacitor-community/admob';

          window.Capacitor = Capacitor;
          window.NP_CAP_APP = App;
          window.NP_CAP_BROWSER = Browser;
          window.NP_CAP_ADMOB = AdMob;
          EOF
          npx esbuild capacitor-plugins-entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=android-web/np-capacitor-plugins.bundle.js

      - name: Generate Android project and sync Kotlin app
        run: |
          npx cap init "NEPSE Pulse" "com.nepsepulse.app" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Configure AdMob app ID and release optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          values = Path("android/app/src/main/res/values/strings.xml")
          tree = ET.parse(values)
          root = tree.getroot()
          name = "admob_app_id"
          existing = root.find("string[@name='admob_app_id']")
          if existing is None:
              node = ET.SubElement(root, "string", {"name": name})
              node.text = "ca-app-pub-1565800134063497~9972330494"
          else:
              existing.text = "ca-app-pub-1565800134063497~9972330494"
          ET.indent(tree, space="    ")
          tree.write(values, encoding="utf-8", xml_declaration=True)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = ET.parse(manifest)
          app = xml.getroot().find("application")
          if app is None:
              raise SystemExit("Android application element missing")
          ns = "{http://schemas.android.com/apk/res/android}"
          found = [m for m in app.findall("meta-data") if m.get(ns + "name") == "com.google.android.gms.ads.APPLICATION_ID"]
          if not found:
              ET.SubElement(app, "meta-data", {
                  ns + "name": "com.google.android.gms.ads.APPLICATION_ID",
                  ns + "value": "@string/admob_app_id"
              })
          ET.indent(xml, space="    ")
          xml.write(manifest, encoding="utf-8", xml_declaration=True)

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          text = text.replace("minifyEnabled false", "minifyEnabled true")
          text = text.replace("shrinkResources false", "shrinkResources true")
          if "minifyEnabled true" not in text:
              text = text.replace("release {", "release {\n            minifyEnabled true", 1)
          if "shrinkResources true" not in text:
              text = text.replace("release {", "release {\n            shrinkResources true", 1)
          if "proguard-android-optimize.txt" not in text:
              text = text.replace("proguard-android.txt", "proguard-android-optimize.txt")
          gradle.write_text(text)
          print("AdMob app ID and release optimization configured.")
          PY


      - name: Register Android Supabase OAuth callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          callback = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.nepsepulse.app" android:host="login-callback" />
                  </intent-filter>
          """
          if 'android:host="login-callback"' not in s:
              pattern = re.compile(
                  r'(<activity\\b[^>]*>.*?'
                  r'<action android:name="android.intent.action.MAIN"\\s*/>.*?'
                  r'<category android:name="android.intent.category.LAUNCHER"\\s*/>.*?</activity>)',
                  re.S
              )
              match = pattern.search(s)
              if not match:
                  raise SystemExit("Could not find launcher activity")
              activity = match.group(1)
              opening = re.search(r"<activity\\b[^>]*>", activity)
              if opening and "android:launchMode=" not in opening.group(0):
                  tag = opening.group(0)
                  activity = activity.replace(tag, tag[:-1] + ' android:launchMode="singleTask">', 1)
              elif opening:
                  activity = re.sub(r'android:launchMode="[^"]+"', 'android:launchMode="singleTask"', activity, count=1)
              activity = activity.replace("</activity>", callback + "\\n    </activity>")
              s = s[:match.start()] + activity + s[match.end():]
              p.write_text(s)
          manifest = p.read_text()
          if 'android:host="login-callback"' not in manifest or 'android:launchMode="singleTask"' not in manifest:
              raise SystemExit("Supabase OAuth callback is not configured")
          print("Supabase OAuth deep-link callback configured.")
          PY

      - name: Build Debug APK with Google test ad units
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/public/np-admob-banner.js")
          s = p.read_text()
          ids = {
            "ca-app-pub-1565800134063497/8028868444": "ca-app-pub-3940256099942544/6300978111",
            "ca-app-pub-1565800134063497/1639379056": "ca-app-pub-3940256099942544/1033173712",
            "ca-app-pub-1565800134063497/9483086731": "ca-app-pub-3940256099942544/5575463023",
          }
          for old, new in ids.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one " + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Restore production ad units and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/public/np-admob-banner.js")
          s = p.read_text()
          ids = {
            "ca-app-pub-3940256099942544/6300978111": "ca-app-pub-1565800134063497/8028868444",
            "ca-app-pub-3940256099942544/1033173712": "ca-app-pub-1565800134063497/1639379056",
            "ca-app-pub-3940256099942544/5575463023": "ca-app-pub-1565800134063497/9483086731",
          }
          for old, new in ids.items():
              if s.count(old) != 1:
                  raise SystemExit("Expected exactly one " + old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            mkdir -p "$RUNNER_TEMP/nepse-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nepse-signing/upload-keystore.jks"
            keytool -list -keystore "$RUNNER_TEMP/nepse-signing/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nepse-signing/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", block + "\n    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in s:
              build_types = s.index("    buildTypes {")
              release_pos = s.index("release {", build_types)
              s = s[:release_pos] + s[release_pos:].replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
            echo "Release signing configured."
          else
            echo "No upload keystore secrets found: release AAB will be unsigned and cannot be uploaded to Play Console yet."
          fi
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEPSE-Pulse-Kotlin-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
