
name: NEPSE Pulse Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Android project
        run: |
          mkdir -p android-web
          cp index.html android-web/index.html
          if [ -f config.js ]; then cp config.js android-web/; fi
          if [ -f auth-config.js ]; then cp auth-config.js android-web/; fi
          if [ -f style.css ]; then cp style.css android-web/; fi
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "NEPSE Pulse" "com.nepsepulse.app" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nepse-pulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
