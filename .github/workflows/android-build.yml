      - name: Configure Android SDK levels and version code
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          # Capacitor normally keeps these values in android/variables.gradle.
          variables = Path("android/variables.gradle")
          changed_sdk = False
          if variables.exists():
              text = variables.read_text()
              for key, value in (("minSdkVersion", 24), ("targetSdkVersion", 36)):
                  pattern = rf"(?m)^(\s*{key}\s*(?:=|:)\s*)\d+(\s*(?://.*)?)$"
                  updated, count = re.subn(pattern, rf"\g<1>{value}\g<2>", text)
                  if count:
                      text = updated
                      changed_sdk = True
                      print(f"Set {key} to {value} in android/variables.gradle")
              variables.write_text(text)

          # Also support templates that declare numeric SDK levels directly in app Gradle.
          app_gradle_files = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          for gradle in app_gradle_files:
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              for key, value in (("minSdk", 24), ("minSdkVersion", 24), ("targetSdk", 36), ("targetSdkVersion", 36)):
                  pattern = rf"(?m)^(\s*{key}\s*(?:=|\s)\s*)\d+(\s*(?://.*)?)$"
                  updated, count = re.subn(pattern, rf"\g<1>{value}\g<2>", text)
                  if count:
                      text = updated
                      changed_sdk = True
                      print(f"Set {key} to {value} in {gradle}")
              gradle.write_text(text)

          # Increment versionCode so this bundle can replace version code 1 in Play Console.
          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          text = app_gradle.read_text()
          updated, count = re.subn(r"(?m)^(\s*versionCode\s*(?:=|\s)\s*)\d+(\s*(?://.*)?)$", r"\g<1>6\g<2>", text, count=1)
          if count:
              app_gradle.write_text(updated)
              print("Set versionCode to 6")
          else:
              print("No numeric versionCode found; leaving version code unchanged")

          if not changed_sdk:
              # Fail only if neither variables.gradle nor app Gradle had numeric SDK declarations.
              vars_text = variables.read_text() if variables.exists() else ""
              app_text = app_gradle.read_text()
              if not re.search(r"(?m)^\s*(?:minSdk|targetSdk|minSdkVersion|targetSdkVersion)\s*(?:=|\s|:)", vars_text + "\n" + app_text):
                  raise SystemExit("Could not find Android SDK declarations to update")

          print("--- SDK declarations after update ---")
          for gradle in [variables, *app_gradle_files]:
              if gradle.exists():
                  for line in gradle.read_text().splitlines():
                      if any(key in line for key in ("minSdk", "targetSdk", "versionCode")):
                          print(f"{gradle}: {line.strip()}")
          PYCODE

      - name: Configure AdMob App ID
        run: |
