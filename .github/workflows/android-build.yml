
name: NEPSE Pulse Android Build - Banner and Interstitial Ads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare web assets
        run: |
          mkdir -p android-web
          rsync -a ./ android-web/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='android-web/' \
            --exclude='node_modules/' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='app.py' \
            --exclude='requirements.txt'
          test -f android-web/index.html

      - name: Install Capacitor and browser plugins
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/browser@7 @capacitor-community/admob@7
          npm install --save-dev @capacitor/cli@7 esbuild

      - name: Bundle Capacitor native plugins and configure banner
        run: |
          cat > capacitor-plugins-entry.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';
          import { AdMob } from '@capacitor-community/admob';

          window.Capacitor = Capacitor;
          window.NP_CAP_APP = App;
          window.NP_CAP_BROWSER = Browser;
          window.NP_CAP_ADMOB = AdMob;
          EOF

          npx esbuild capacitor-plugins-entry.js \
            --bundle --format=iife --platform=browser --target=es2020 \
            --outfile=android-web/np-capacitor-plugins.bundle.js

          cat > android-web/np-admob-banner.js <<'EOF'
          (function () {
            'use strict';

            let started = false;
            let interstitialReady = false;
            let navActions = 0;
            let lastInterstitialAt = 0;
            let interstitialShowing = false;
            const INTERSTITIAL_ID = 'ca-app-pub-1565800134063497/1639379056';
            const NAV_LABELS = /^(home|market|screener|quant|alerts|watchlist|market structure|professional charting|charting|ipo center|profile|more|traders zone)$/i;
            const COOLDOWN_MS = 5 * 60 * 1000;
            const ACTIONS_BETWEEN_ADS = 8;

            function nativeAndroid() {
              return !!(window.Capacitor &&
                typeof window.Capacitor.isNativePlatform === 'function' &&
                window.Capacitor.isNativePlatform());
            }

            function report(message) {
              console.log('[NEPSE AdMob]', message);
            }

            async function prepareInterstitial(admob) {
              try {
                await admob.prepareInterstitial({ adId: INTERSTITIAL_ID });
                interstitialReady = true;
                report('banner configured; interstitial ready');
              } catch (error) {
                interstitialReady = false;
                console.warn('[NEPSE AdMob] Interstitial load failed:', error);
                report('banner requested; interstitial not available yet');
              }
            }

            async function showInterstitialAtTransition(admob) {
              const now = Date.now();
              if (!interstitialReady || interstitialShowing ||
                  now - lastInterstitialAt < COOLDOWN_MS) return;
              interstitialShowing = true;
              interstitialReady = false;
              lastInterstitialAt = now;
              try {
                // Only called after several explicit top-level navigation actions;
                // never show on app launch, app exit, or every tap.
                await admob.showInterstitial({ adId: INTERSTITIAL_ID });
              } catch (error) {
                console.warn('[NEPSE AdMob] Interstitial display failed:', error);
              } finally {
                interstitialShowing = false;
                // Prepare the next ad after the current presentation attempt.
                await prepareInterstitial(admob);
              }
            }

            function installNavigationPlacement(admob) {
              document.addEventListener('click', function (event) {
                if (!nativeAndroid()) return;
                const target = event.target && event.target.closest
                  ? event.target.closest('button, a, [role="tab"], [role="button"]')
                  : null;
                if (!target) return;
                const label = String(target.innerText || target.getAttribute('aria-label') || target.title || '')
                  .replace(/\s+/g, ' ').trim();
                if (!NAV_LABELS.test(label)) return;
                navActions += 1;
                if (navActions >= ACTIONS_BETWEEN_ADS) {
                  navActions = 0;
                  // A brief delay lets the navigation click finish before the ad opens.
                  Promise.resolve().then(() => showInterstitialAtTransition(admob));
                }
              }, true);
            }

            async function startAdMob() {
              if (started || !nativeAndroid()) return;
              started = true;
              const admob = window.NP_CAP_ADMOB;
              if (!admob) {
                report('FAILED — native AdMob plugin unavailable');
                return;
              }

              try {
                report('checking consent…');
                let consent = await admob.requestConsentInfo();
                if (consent && consent.isConsentFormAvailable &&
                    String(consent.status).toLowerCase().includes('required')) {
                  consent = await admob.showConsentForm();
                }
                if (consent && consent.canRequestAds === false) {
                  report('ads paused until consent permits requests');
                  return;
                }

                await admob.initialize();
                if (typeof admob.addListener === 'function') {
                  try {
                    await admob.addListener('bannerAdLoaded', () => report('banner loaded'));
                    await admob.addListener('bannerAdFailedToLoad', error => {
                      report('banner failed to load — ' + JSON.stringify(error));
                    });
                  } catch (_) {}
                }

                await admob.showBanner({
                  adId: 'ca-app-pub-1565800134063497/8028868444',
                  adSize: 'ADAPTIVE_BANNER',
                  position: 'BOTTOM_CENTER',
                  margin: 0
                });
                report('real banner requested; preparing interstitial…');
                installNavigationPlacement(admob);
                await prepareInterstitial(admob);
              } catch (error) {
                report('ERROR — ' + (error && error.message ? error.message : JSON.stringify(error)));
                started = false;
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', startAdMob, { once: true });
            } else {
              startAdMob();
            }
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-web/index.html')
          s = p.read_text()
          tags = [
              '<script src="./np-capacitor-plugins.bundle.js"></script>',
              '<script src="./np-admob-banner.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  pos = s.lower().rfind('</head>')
                  if pos < 0:
                      raise SystemExit('Could not find </head> in android-web/index.html')
                  s = s[:pos] + tag + '\n' + s[pos:]
          p.write_text(s)
          PY

      - name: Initialize Capacitor Android project
        run: |
          npx cap init "NEPSE Pulse" "com.nepsepulse.app" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Apply NEPSE Pulse launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PYICON'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          # Exact NEPSE Pulse icon supplied by the app owner.
          encoded_icon = """"""
          source = Image.open(BytesIO(base64.b64decode(encoded_icon))).convert("RGB")
          density_sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in density_sizes.items():
              folder = Path("android/app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
              foreground_size = size
              source.resize((foreground_size, foreground_size), Image.Resampling.LANCZOS).save(
                  folder / "ic_launcher_foreground.png", optimize=True
              )

          res = Path("android/app/src/main/res")
          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "values" / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n'
              '<resources><color name="ic_launcher_background">#06123B</color></resources>\\n',
              encoding="utf-8",
          )
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher", "ic_launcher_round"):
              (adaptive / f"{name}.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\\n'
                  '    <background android:drawable="@color/ic_launcher_background"/>\\n'
                  '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\\n'
                  '</adaptive-icon>\\n',
                  encoding="utf-8",
              )
          print("Applied the supplied NEPSE Pulse launcher icon to Android launcher resources.")
          PYICON

      - name: Configure Android SDK levels and version code
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          # Capacitor normally keeps these values in android/variables.gradle.
          variables = Path("android/variables.gradle")
          changed_sdk = False
          if variables.exists():
              text = variables.read_text()
              for key, value in (("minSdkVersion", 24), ("targetSdkVersion", 36)):
                  pattern = rf"(?m)^(\s*{key}\s*(?:=|:)\s*)\d+(\s*(?://.*)?)$"
                  updated, count = re.subn(pattern, rf"\g<1>{value}\g<2>", text)
                  if count:
                      text = updated
                      changed_sdk = True
                      print(f"Set {key} to {value} in android/variables.gradle")
              variables.write_text(text)

          # Also support templates that declare numeric SDK levels directly in app Gradle.
          app_gradle_files = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          for gradle in app_gradle_files:
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              for key, value in (("minSdk", 24), ("minSdkVersion", 24), ("targetSdk", 36), ("targetSdkVersion", 36)):
                  pattern = rf"(?m)^(\s*{key}\s*(?:=|\s)\s*)\d+(\s*(?://.*)?)$"
                  updated, count = re.subn(pattern, rf"\g<1>{value}\g<2>", text)
                  if count:
                      text = updated
                      changed_sdk = True
                      print(f"Set {key} to {value} in {gradle}")
              gradle.write_text(text)

          # Increment versionCode so this bundle can replace version code 1 in Play Console.
          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          text = app_gradle.read_text()
          updated, count = re.subn(r"(?m)^(\s*versionCode\s*(?:=|\s)\s*)\d+(\s*(?://.*)?)$", r"\g<1>6\g<2>", text, count=1)
          if count:
              app_gradle.write_text(updated)
              print("Set versionCode to 6")
          else:
              print("No numeric versionCode found; leaving version code unchanged")

          if not changed_sdk:
              # Fail only if neither variables.gradle nor app Gradle had numeric SDK declarations.
              vars_text = variables.read_text() if variables.exists() else ""
              app_text = app_gradle.read_text()
              if not re.search(r"(?m)^\s*(?:minSdk|targetSdk|minSdkVersion|targetSdkVersion)\s*(?:=|\s|:)", vars_text + "\n" + app_text):
                  raise SystemExit("Could not find Android SDK declarations to update")

          print("--- SDK declarations after update ---")
          for gradle in [variables, *app_gradle_files]:
              if gradle.exists():
                  for line in gradle.read_text().splitlines():
                      if any(key in line for key in ("minSdk", "targetSdk", "versionCode")):
                          print(f"{gradle}: {line.strip()}")
          PYCODE

      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          app_id = 'ca-app-pub-1565800134063497~9972330494'
          meta_name = 'com.google.android.gms.ads.APPLICATION_ID'

          if meta_name not in s:
              match = re.search(r'<application\b[^>]*>', s)
              if not match:
                  raise SystemExit('Could not find <application> in AndroidManifest.xml')
              metadata = (
                  '\n        <meta-data\n'
                  '            android:name="' + meta_name + '"\n'
                  '            android:value="' + app_id + '"/>\n'
              )
              s = s[:match.end()] + metadata + s[match.end():]
              manifest.write_text(s)
          else:
              # Ensure an existing entry uses the correct App ID.
              pattern = re.compile(
                  r'(<meta-data\s+android:name="' + re.escape(meta_name) +
                  r'"\s+android:value=")[^"]*("\s*/?>)'
              )
              s2, count = pattern.subn(r'\g<1>' + app_id + r'\g<2>', s, count=1)
              if count:
                  manifest.write_text(s2)

          values = Path('android/app/src/main/res/values')
          values.mkdir(parents=True, exist_ok=True)
          strings = values / 'strings.xml'
          content = strings.read_text() if strings.exists() else '<resources>\n</resources>\n'
          line = '<string name="admob_app_id">' + app_id + '</string>'
          if 'name="admob_app_id"' not in content:
              content = content.replace('</resources>', '    ' + line + '\n</resources>')
              strings.write_text(content)
          PY

      - name: Register Android login callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          callback = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.nepsepulse.app" android:host="login-callback" />
                  </intent-filter>
          '''
          if 'android:host="login-callback"' not in s:
              pattern = re.compile(
                  r'(<activity\b[^>]*>.*?'
                  r'<action android:name="android.intent.action.MAIN"\s*/>.*?'
                  r'<category android:name="android.intent.category.LAUNCHER"\s*/>.*?</activity>)',
                  re.S
              )
              match = pattern.search(s)
              if not match:
                  raise SystemExit('Could not find launcher activity in AndroidManifest.xml')
              activity = match.group(1)
              # Ensure OAuth deep links are delivered to the existing Capacitor activity.
              opening = re.search(r'<activity\b[^>]*>', activity)
              if opening and 'android:launchMode=' not in opening.group(0):
                  tag = opening.group(0)
                  activity = activity.replace(tag, tag[:-1] + ' android:launchMode="singleTask">', 1)
              elif opening and 'android:launchMode=' in opening.group(0):
                  activity = re.sub(r'android:launchMode="[^"]+"', 'android:launchMode="singleTask"', activity, count=1)
              activity = activity.replace('</activity>', callback + '\n    </activity>')
              s = s[:match.start()] + activity + s[match.end():]
              p.write_text(s)
          # Fail the build if the callback filter or launch mode is absent.
          manifest = p.read_text()
          if 'android:host="login-callback"' not in manifest:
              raise SystemExit('OAuth callback intent-filter was not registered')
          if 'android:launchMode="singleTask"' not in manifest:
              raise SystemExit('Launcher activity must use launchMode=singleTask for OAuth callbacks')
          print('Verified Android OAuth callback intent-filter and singleTask launch mode.')
          PY

      - name: Fix Kotlin dependency versions
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          
      - name: Pin compatible AndroidX Browser
        run: |
          printf '\nconfigurations.configureEach { resolutionStrategy.force "androidx.browser:browser:1.8.0" }\n' >> android/app/build.gradle


      # Android 15 (API 35+) draws apps that target SDK 35+ edge-to-edge, so the
      # window extends behind the status and navigation bars. Consume those insets
      # as padding on the activity content so the page header, bottom navigation,
      # buttons and the bottom ad banner are never hidden behind the system bars.
      # Only non-deprecated framework APIs are used here: no status/navigation bar
      # colour calls and no systemUiVisibility flags.
      - name: Apply Android 15 edge-to-edge insets
        run: |
          python3 - <<'PYINSETS'
          from pathlib import Path
          import re

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity.java not found in the generated Capacitor project")
          main = candidates[0]
          src = main.read_text()

          template = """package com.nepsepulse.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applySystemBarInsets();
              }

              /**
               * Android 15 (API 35) draws apps that target SDK 35 or higher
               * edge-to-edge, so the window content sits behind the status and
               * navigation bars. Consume the system-bar insets as padding on the
               * activity content so the page header, the bottom navigation, buttons
               * and the bottom ad banner all stay in the safe area while scrolling
               * still behaves normally.
               *
               * Padding the content view also keeps any native child (including the
               * AdMob banner) inside the safe area, so ad placements are preserved.
               *
               * On API 34 and below the window decor already fits the system bars, so
               * no padding is added there and double padding is impossible. Only
               * non-deprecated framework APIs are used; this replaces deprecated
               * status/navigation bar colour and system-ui-visibility handling.
               */
              private void applySystemBarInsets() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.VANILLA_ICE_CREAM) return;

                  View content = findViewById(android.R.id.content);
                  if (content == null) return;

                  content.setOnApplyWindowInsetsListener((view, insets) -> {
                      android.graphics.Insets bars = insets.getInsets(
                          android.view.WindowInsets.Type.systemBars()
                              | android.view.WindowInsets.Type.displayCutout());
                      view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                      return insets;
                  });
                  content.requestApplyInsets();
              }
          }
          """

          if "applySystemBarInsets" in src:
              print("Edge-to-edge inset handling already present.")
          else:
              pattern = re.compile(r"public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{\s*\}", re.S)
              if not pattern.search(src) or src.count("package ") != 1:
                  raise SystemExit("MainActivity does not match the expected Capacitor template; review it manually")
              # The template is a complete, self-contained MainActivity, so it
              # replaces the whole file. Splicing it at the class declaration
              # would leave the original package/import preamble in front of a
              # second one, which javac rejects.
              main.write_text(template)
              print("Wrote edge-to-edge inset handling into " + str(main))

          check = main.read_text()
          if "applySystemBarInsets" not in check or "setOnApplyWindowInsetsListener" not in check:
              raise SystemExit("Edge-to-edge inset handling was not applied")
          if check.count("package com.nepsepulse.app;") != 1 or check.count("import com.getcapacitor.BridgeActivity;") != 1:
              raise SystemExit("MainActivity has duplicate package/import declarations")
          if "setStatusBarColor" in check or "setNavigationBarColor" in check or "SYSTEM_UI_FLAG" in check:
              raise SystemExit("Deprecated edge-to-edge API found in generated source")
          print("Verified edge-to-edge inset handling in " + str(main))
          PYINSETS

      # Play Console reports obfuscation at 1% and optimization below threshold
      # because the release buildType ships with R8 disabled. Enable shrinking,
      # obfuscation and optimization with the optimising default rule set plus
      # project keep rules. Capacitor supplies its plugin keep rules through
      # consumerProguardFiles, so reflection-based plugins, auth, networking and
      # the AdMob bridge keep working. Signing configuration is not touched.
      - name: Enable R8 optimization for release
        run: |
          python3 - <<'PYR8'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          def matching_close(text, open_pos):
              depth = 0
              quote = None
              escaped = False
              for i in range(open_pos, len(text)):
                  ch = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Could not parse Gradle braces")

          m = re.search(r"(?m)^\s*buildTypes\s*\{", s)
          if not m:
              raise SystemExit("buildTypes block not found")
          brace = s.find("{", m.start())
          close = matching_close(s, brace)
          block = s[brace + 1:close]

          rel = re.search(r"(?m)^\s*release\s*\{", block)
          if not rel:
              raise SystemExit("release buildType not found")
          rel_brace = block.find("{", rel.start())
          rel_close = matching_close(block, rel_brace)
          body = block[rel_brace + 1:rel_close]

          if re.search(r"(?m)^\s*signingConfig\b", body):
              raise SystemExit("Refusing to edit a release block that declares signingConfig here")

          # Normalise instead of toggling: drop every existing minify/shrink line
          # and write exactly one of each, so re-running the step is safe.
          new_body = re.sub(r"(?m)^[ \t]*(?:minifyEnabled|shrinkResources)[ \t]+\w+[ \t]*\r?\n?", "", body)
          new_body = "\n            minifyEnabled true\n            shrinkResources true" + new_body
          new_body = new_body.replace("'proguard-android.txt'", "'proguard-android-optimize.txt'")

          block = block[:rel_brace + 1] + new_body + block[rel_close:]
          s = s[:brace + 1] + block + s[close:]
          gradle.write_text(s)

          out = gradle.read_text()
          m2 = re.search(r"(?m)^\s*buildTypes\s*\{", out)
          b2 = out.find("{", m2.start())
          c2 = matching_close(out, b2)
          blk = out[b2 + 1:c2]
          r2 = re.search(r"(?m)^\s*release\s*\{", blk)
          rb = blk.find("{", r2.start())
          rc = matching_close(blk, rb)
          final = blk[rb + 1:rc]

          for required in ("minifyEnabled true", "shrinkResources true", "proguard-android-optimize.txt"):
              if final.count(required) != 1:
                  raise SystemExit("Expected exactly one %r in the release block, found %d" % (required, final.count(required)))
          if "minifyEnabled false" in final:
              raise SystemExit("Release minification is still disabled")

          pro = Path("android/app/proguard-rules.pro")
          rules = pro.read_text() if pro.exists() else ""
          addition = """
          # --- NEPSE Pulse release hardening (added by CI) ---
          # Keep readable stack traces from the R8-mapped release build.
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          # Retain runtime annotations so Capacitor's @CapacitorPlugin /
          # @PluginMethod keep rules still match plugin classes and methods.
          -keepattributes *Annotation*
          # WebView JavaScript bridges must never be stripped.
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          # Native library entry points (system WebView / ads) stay resolvable.
          -keepclasseswithmembernames,includedescriptorclasses class * {
              native <methods>;
          }
          """
          if "NEPSE Pulse release hardening" not in rules:
              pro.write_text(rules.rstrip() + "\n" + addition)

          pro_check = pro.read_text()
          for required in ("@android.webkit.JavascriptInterface", "*Annotation*", "SourceFile"):
              if required not in pro_check:
                  raise SystemExit("Missing R8 keep rule: " + required)

          print("--- release buildType after edit ---")
          print(final.strip())
          print("R8 enabled for release; keep rules written to", pro)
          PYR8

      # Always produce a debug APK for device testing. This uses the Android debug key,
      # and does not modify or replace the Play Store upload keystore.
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEPSE-Pulse-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nepse-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nepse-signing/upload-keystore.jks"
          test -s "$RUNNER_TEMP/nepse-signing/upload-keystore.jks"

          # Validate that the uploaded keystore opens and contains the configured alias.
          keytool -list -keystore "$RUNNER_TEMP/nepse-signing/upload-keystore.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Release keystore and key alias validated."

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nepse-signing/upload-keystore.jks" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          def matching_close(text, open_pos):
              depth = 0
              quote = None
              escaped = False
              for i in range(open_pos, len(text)):
                  ch = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Could not parse Gradle braces")

          def locate_block(text, name, start=0):
              m = re.search(r"(?m)^\s*" + re.escape(name) + r"\s*\{", text[start:])
              if not m:
                  return None
              line_start = start + m.start()
              brace = text.find("{", line_start, start + m.end())
              return line_start, brace, matching_close(text, brace)

          build = locate_block(s, "buildTypes")
          if not build:
              raise SystemExit("Could not find buildTypes block in android/app/build.gradle")
          signing = locate_block(s, "signingConfigs")
          if not signing:
              insertion = build[0]
              config = ("    signingConfigs {\n"
                        "        release {\n"
                        "            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))\n"
                        "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
                        "            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
                        "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
                        "        }\n"
                        "    }\n\n")
              s = s[:insertion] + config + s[insertion:]

          # Remove any misplaced signingConfig line from signingConfigs.release.
          signing = locate_block(s, "signingConfigs")
          sign_body = s[signing[1] + 1:signing[2]]
          rel = re.search(r"(?m)^\s*release\s*\{", sign_body)
          if rel:
              rel_line = signing[1] + 1 + rel.start()
              rel_brace = s.find("{", rel_line, signing[2] + 1)
              rel_close = matching_close(s, rel_brace)
              body = s[rel_brace + 1:rel_close]
              body = re.sub(r"(?m)^\s*signingConfig\s+signingConfigs\.release\s*;?\s*\n?", "", body)
              s = s[:rel_brace + 1] + body + s[rel_close:]

          # Add signingConfig only inside buildTypes.release.
          build = locate_block(s, "buildTypes")
          body = s[build[1] + 1:build[2]]
          rel = re.search(r"(?m)^\s*release\s*\{", body)
          if not rel:
              raise SystemExit("Could not find release buildType inside buildTypes")
          rel_line = build[1] + 1 + rel.start()
          rel_brace = s.find("{", rel_line, build[2] + 1)
          rel_close = matching_close(s, rel_brace)
          release_body = s[rel_brace + 1:rel_close]
          release_body = re.sub(r"(?m)^\s*signingConfig\s+signingConfigs\.release\s*;?\s*\n?", "", release_body)
          release_body = "\n            signingConfig signingConfigs.release\n" + release_body
          s = s[:rel_brace + 1] + release_body + s[rel_close:]
          gradle.write_text(s)
          print("Release signing configured in buildTypes.release.")
          PY

      - name: Build release Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nepse-signing/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NEPSE-Pulse-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
