
name: NEPSE Pulse Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare web assets
        run: |
          mkdir -p android-web

          rsync -a ./ android-web/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='android-web/' \
            --exclude='node_modules/' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='app.py' \
            --exclude='requirements.txt'

          test -f android-web/index.html

      - name: Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/app @capacitor/browser
          npm install --save-dev @capacitor/cli

          npx cap init "NEPSE Pulse" "com.nepsepulse.app" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Register Android login callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          callback = """
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.nepsepulse.app"
                        android:host="login-callback" />
              </intent-filter>
          """

          if "android:host=\"login-callback\"" not in s:
              pattern = re.compile(
                  r'(<activity\b[^>]*>.*?'
                  r'<action android:name="android.intent.action.MAIN"\s*/>.*?'
                  r'<category android:name="android.intent.category.LAUNCHER"\s*/>.*?</activity>)',
                  re.S
              )
              match = pattern.search(s)
              if not match:
                  raise SystemExit("Could not find launcher activity in AndroidManifest.xml")
              activity = match.group(1)
              activity = activity.replace("</activity>", callback + "\n    </activity>")
              s = s[:match.start()] + activity + s[match.end():]
              p.write_text(s)
          PY

      - name: Fix Kotlin dependency versions
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nepse-pulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
