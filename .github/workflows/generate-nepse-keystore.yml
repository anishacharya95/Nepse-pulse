name: Generate NEPSE Pulse Upload Keystore (ONE TIME)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate upload keystore once
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo '::error::First add ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions. Use strong passwords and keep them safe.'
            exit 1
          fi
          mkdir -p signing-output
          keytool -genkeypair -v \
            -keystore signing-output/nepse-pulse-upload.jks \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias nepsepulse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=NEPSE Pulse, OU=Mobile, O=NEPSE Pulse, L=Kathmandu, ST=Bagmati, C=NP'
          base64 -w 0 signing-output/nepse-pulse-upload.jks > signing-output/ANDROID_KEYSTORE_BASE64.txt
          keytool -list -keystore signing-output/nepse-pulse-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias nepsepulse

      - name: Upload keystore setup files (download immediately; expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: nepse-pulse-upload-key-setup
          path: signing-output/
          if-no-files-found: error
          retention-days: 1
